<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var path = location.pathname;
      var base = path.endsWith("/")
        ? path
        : /\.[^/]+$/.test(path)
          ? path.slice(0, path.lastIndexOf("/") + 1)
          : path + "/";
      window.__MENU_BASE__ = base;
      var el = document.createElement("base");
      el.href = base;
      document.head.appendChild(el);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persis Biryani Indian Grill — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-deep: #0a1f1a;
      --green-mid: #122820;
      --gold: #c9a227;
      --gold-light: #e8c96a;
      --cream: #f5efe3;
      --cream-muted: rgba(245, 239, 227, 0.82);
      --page-w: 8.5in;
      --page-h: 11in; /* US Letter */

      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

      --fs-display: 1.25rem;
      --fs-display-sm: 1.05rem;
      --fs-section: 0.8125rem;
      --fs-item: 0.8125rem;
      --fs-desc: 0.6875rem;
      --fs-caption: 0.6875rem;
      --fs-body: 0.8125rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      font-weight: 400;
      background: #1a1a1a;
      color: var(--cream);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .fab-bar {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fab {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(201, 162, 39, 0.55);
      background: rgba(10, 31, 26, 0.92);
      color: var(--gold);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      transition: background 0.2s, color 0.2s, transform 0.2s, border-color 0.2s;
    }

    .fab:hover {
      background: var(--gold);
      color: var(--green-deep);
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .fab[aria-pressed="true"] {
      background: rgba(201, 162, 39, 0.18);
      border-color: var(--gold-light);
      color: var(--gold-light);
    }

    .fab[aria-pressed="true"]:hover {
      background: var(--gold);
      color: var(--green-deep);
    }

    .fab svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .item-desc {
      display: none;
      font-family: var(--font-sans);
      font-size: var(--fs-desc);
      font-weight: 400;
      line-height: 1.5;
      color: var(--cream-muted);
      margin-top: 2px;
    }

    body.show-descriptions .item-desc {
      display: block;
    }

    #menu-root {
      padding: 32px 0 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .page {
      width: var(--page-w);
      height: var(--page-h);
      position: relative;
      overflow: hidden;
      background: var(--green-deep);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    }

    .page-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--menu-bg, url("./assets/background.jpg")) center center / cover no-repeat;
    }


    .page-inner {
      position: relative;
      z-index: 3;
      padding: 0.55in 0.6in 0.5in;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .page-chrome {
      flex-shrink: 0;
    }

    .page-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .page-body--fit {
      transform-origin: top center;
    }

    .page-header {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .page-logo {
      width: 180px;
      height: auto;
    }

    .page-border {
      position: absolute;
      inset: 0.28in;
      border: 1px solid rgba(201, 162, 39, 0.35);
      pointer-events: none;
      z-index: 2;
    }

    .page-border::after {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(201, 162, 39, 0.15);
    }

    /* Cover */
    .page.cover .page-inner {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 28px;
    }

    .cover-logo {
      width: 320px;
      max-width: 80%;
      height: auto;
    }

    .cover-welcome {
      font-family: var(--font-sans);
      font-size: var(--fs-display-sm);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    .cover-name {
      font-family: var(--font-sans);
      font-size: var(--fs-display);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--cream);
      line-height: 1.3;
    }

    .cover-desc {
      max-width: 5.5in;
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      font-weight: 400;
      line-height: 1.65;
      color: var(--cream-muted);
    }

    .cover-tagline {
      margin-top: 12px;
      font-family: var(--font-sans);
      font-size: var(--fs-caption);
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--gold);
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 200px;
      color: var(--gold);
      opacity: 0.7;
    }

    .ornament::before,
    .ornament::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* Section headers */
    .section-title,
    .biryani-category-title {
      font-family: var(--font-sans);
      font-size: var(--fs-section);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(201, 162, 39, 0.45);
    }

    .biryani-category-title {
      margin: 14px 0 10px;
    }

    .biryani-category-title:first-child {
      margin-top: 0;
    }

    .section-subtitle,
    .biryani-page-subtitle {
      font-family: var(--font-sans);
      font-size: var(--fs-caption);
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--gold-light);
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .biryani-page-subtitle {
      text-align: center;
      margin: -10px 0 18px;
    }

    /* Two-column layout */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35in 0.4in;
      flex: 1;
    }

    .one-col-grid {
      display: block;
      flex: 1;
      columns: 2;
      column-gap: 0.4in;
    }

    .sections-stack {
      display: flex;
      flex-direction: column;
      gap: 0.16in;
      align-content: start;
    }

    .section--items-2 {
      columns: 2;
      column-gap: 0.4in;
    }

    .section--items-2 .section-title,
    .section--items-2 .section-subtitle {
      column-span: all;
      break-after: avoid;
    }

    .section--items-2 .menu-item,
    .section--items-2 .compact-group,
    .section--items-2 .biryani-section {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .two-col-grid .section--two-col {
      columns: unset;
    }

    .one-col-grid .section-title {
      column-span: all;
      break-after: avoid;
    }

    .one-col-grid .section-subtitle {
      column-span: all;
    }

    .one-col-grid .menu-item,
    .one-col-grid .compact-group {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .multi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3in 0.35in;
      flex: 1;
      align-content: start;
    }

    /* 3 sections: two on top, third spans full width */
    .multi-grid:has(> section:nth-child(3):last-child) > section:nth-child(3) {
      grid-column: 1 / -1;
      columns: 2;
      column-gap: 0.4in;
    }

    .multi-grid:has(> section:nth-child(3):last-child) > section:nth-child(3) .section-title,
    .multi-grid:has(> section:nth-child(3):last-child) > section:nth-child(3) .section-subtitle {
      column-span: all;
    }

    /* 4 sections: 2×2 grid */
    .multi-grid:has(> section:nth-child(4)) > section:nth-child(3),
    .multi-grid:has(> section:nth-child(4)) > section:nth-child(4) {
      grid-column: auto;
      columns: unset;
    }

    /* Menu items */
    .menu-item {
      margin-bottom: 11px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .item-name,
    .item-price,
    .biryani-section-title,
    .biryani-item .item-name {
      font-family: var(--font-sans);
      font-size: var(--fs-item);
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.4;
    }

    .item-name,
    .biryani-section-title,
    .biryani-item .item-name {
      color: var(--cream);
    }

    .item-price {
      color: var(--gold-light);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .biryani-page-title {
      font-family: var(--font-sans);
      font-size: var(--fs-display);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
      margin-bottom: 18px;
    }

    .biryani-section {
      margin-bottom: 16px;
      break-inside: avoid;
    }

    .biryani-section:not(:has(.biryani-section-title)) {
      margin-bottom: 11px;
    }

    .biryani-section-title {
      margin-bottom: 4px;
    }

    .biryani-section--variants .biryani-item {
      position: relative;
      padding-left: 0.9em;
    }

    .biryani-section--variants .biryani-item::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--gold-light);
      opacity: 0.85;
    }

    .biryani-section--variants .biryani-item-block .item-desc {
      padding-left: 0.9em;
    }

    .biryani-section--variants .biryani-item .item-name,
    .biryani-section--variants .biryani-item .item-price {
      font-size: calc(var(--fs-item) * 0.92);
    }

    .biryani-blurb,
    .biryani-note {
      font-family: var(--font-sans);
      font-size: var(--fs-desc);
      font-weight: 400;
      line-height: 1.5;
      color: var(--cream-muted);
    }

    .biryani-blurb {
      margin-bottom: 8px;
    }

    .biryani-note {
      color: var(--gold-light);
      margin-top: 2px;
    }

    .biryani-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .biryani-item-block {
      break-inside: avoid;
    }

    .biryani-item-block .item-desc {
      margin-top: 2px;
    }

    .biryani-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    /* Back cover */
    .page.back .page-inner {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
    }

    .back-logo {
      width: 240px;
      max-width: 70%;
      height: auto;
      margin-bottom: 8px;
    }

    .back-title {
      font-family: var(--font-sans);
      font-size: var(--fs-display);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .back-sub {
      font-family: var(--font-sans);
      font-size: var(--fs-caption);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cream);
    }

    .back-contact {
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      font-weight: 400;
      line-height: 1.8;
      color: var(--cream-muted);
    }

    .back-contact strong {
      color: var(--gold-light);
      font-weight: 600;
    }

    .back-website {
      font-family: var(--font-sans);
      font-size: var(--fs-caption);
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .back-social-heading {
      font-family: var(--font-sans);
      font-size: var(--fs-caption);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cream-muted);
      margin-bottom: 8px;
    }

    .back-social-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .back-social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      text-decoration: none;
      font-size: 0;
      line-height: 0;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .back-social-link svg {
      display: block;
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .back-social-link:hover {
      transform: translateY(-1px);
    }

    .back-social-link--whatsapp {
      background: #25d366;
    }

    .back-social-link--whatsapp:hover {
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    }

    .back-social-link--facebook {
      background: #1877f2;
    }

    .back-social-link--facebook:hover {
      box-shadow: 0 4px 14px rgba(24, 119, 242, 0.35);
    }

    .back-social-link--instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
    }

    .back-social-link--instagram:hover {
      box-shadow: 0 4px 14px rgba(221, 42, 123, 0.35);
    }

    @media not print {
      .print-only { display: none !important; }
    }

    @media print {
      .screen-only { display: none !important; }
    }

    .loading {
      text-align: center;
      padding: 80px;
      color: var(--cream-muted);
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      font-weight: 500;
    }

    @page {
      size: letter portrait;
      margin: 0;
    }

    @media print {
      html, body {
        width: var(--page-w);
        margin: 0 !important;
        padding: 0 !important;
        background: var(--green-deep) !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .fab-bar { display: none !important; }

      .item-desc { display: none !important; }

      body.show-descriptions .item-desc { display: block !important; }

      #menu-root {
        display: block;
        padding: 0 !important;
        margin: 0 !important;
        gap: 0;
      }

      .page {
        width: var(--page-w);
        height: var(--page-h);
        min-height: unset;
        max-height: var(--page-h);
        margin: 0;
        padding: 0;
        box-shadow: none;
        overflow: hidden;
        page-break-after: always;
        break-after: page;
        page-break-inside: avoid;
        break-inside: avoid;
        background-color: var(--green-deep);
        background-image: var(--menu-bg, url("./assets/background.jpg"));
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .page:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      .page-inner {
        height: var(--page-h);
        max-height: var(--page-h);
        overflow: hidden;
        padding: 0.55in 0.6in 0.5in;
      }

      .page.back .page-inner {
        gap: 10px;
        padding: 0.45in 0.55in 0.4in;
      }

      .page.back .back-logo {
        width: 1.75in;
      }

      .page.back .back-title {
        letter-spacing: 0.16em;
      }

      .page.back .back-contact {
        line-height: 1.7;
      }

      .back-social {
        width: 100%;
      }

      .back-social-qrs {
        display: grid;
        grid-template-columns: repeat(3, 0.78in);
        justify-content: center;
        gap: 0.12in;
        width: 100%;
      }

      .back-social-qr-item {
        display: grid;
        grid-template-rows: auto auto;
        justify-items: center;
        align-content: start;
        gap: 5px;
      }

      .back-social-qr-wrap {
        display: block;
        padding: 4px;
        background: rgba(245, 239, 227, 0.97);
        border: 1px solid rgba(201, 162, 39, 0.55);
        line-height: 0;
      }

      .back-social-qr-wrap img {
        display: block;
        width: 0.58in;
        height: 0.58in;
        image-rendering: pixelated;
      }

      .back-social-qr-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        color: #fff;
        flex-shrink: 0;
      }

      .back-social-qr-icon svg {
        display: block;
        width: 13px;
        height: 13px;
        fill: currentColor;
      }

      .back-social-qr-icon--whatsapp {
        background: #25d366;
      }

      .back-social-qr-icon--facebook {
        background: #1877f2;
      }

      .back-social-qr-icon--instagram {
        background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
      }

      .page-bg {
        height: var(--page-h);
      }
    }

    @media screen and (max-width: 900px) {
      .page {
        width: 100%;
        height: calc(100vw * 11 / 8.5);
        max-height: calc(100vw * 11 / 8.5);
        min-height: calc(100vw * 11 / 8.5);
        overflow: hidden;
      }

      .page.page--mobile-menu {
        height: auto;
        min-height: 0;
        max-height: none;
        overflow: visible;
      }

      .page.page--mobile-menu .page-inner {
        height: auto;
        min-height: 0;
      }

      .page.page--mobile-menu .page-body {
        flex: none;
        overflow: visible;
      }

      .mobile-sections-stack {
        display: flex;
        flex-direction: column;
        gap: 0.28in;
      }

      .mobile-sections-stack section {
        columns: 1 !important;
      }

      .mobile-page-heading {
        font-family: var(--font-sans);
        font-size: var(--fs-display);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--gold);
        text-align: center;
        margin: 0.12in 0 0.08in;
      }

      .mobile-page-heading:first-child {
        margin-top: 0;
      }

      .two-col-grid,
      .multi-grid,
      .one-col-grid {
        grid-template-columns: 1fr;
      }

      .one-col-grid {
        columns: 1;
      }

      .section--items-2,
      .multi-grid:has(> section:nth-child(3):last-child) > section:nth-child(3) {
        columns: 1;
      }

      .page-border { inset: 12px; }
      .page-inner { padding: 48px 24px 32px; }

      .page:not(.cover):not(.back) .page-header {
        display: none;
      }
    }
  </style>
</head>
<body class="show-descriptions">
  <div class="fab-bar" aria-label="Menu actions">
    <button
      type="button"
      class="fab"
      id="toggle-descriptions"
      aria-pressed="true"
      aria-label="Hide descriptions"
      title="Hide descriptions"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h10M4 18h14" />
        <path d="M18 10v8" />
        <path d="M15 13h6" />
      </svg>
    </button>
    <button
      type="button"
      class="fab"
      id="print-menu"
      aria-label="Print or save as PDF"
      title="Print / Save as PDF (US Letter · enable Background graphics)"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 9V3h12v6" />
        <rect x="6" y="13" width="12" height="8" rx="1" />
        <path d="M6 17h12v-4H6z" />
        <path d="M18 9h2a2 2 0 0 1 2 2v4h-4" />
      </svg>
    </button>
  </div>

  <div id="menu-root">
    <p class="loading">Loading menu…</p>
  </div>

  <script type="module" src="./js/menu-app.js"></script>
</body>
</html>
